version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: e2-standard-2
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
blocks:
  - name: long
    dependencies: []
    task:
      jobs:
        - name: long
          commands:
            - sleep 1200
  - name: short
    dependencies: []
    task:
      jobs:
        - name: short
          commands:
            - sleep 1
